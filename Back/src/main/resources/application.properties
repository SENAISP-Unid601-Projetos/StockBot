spring.application.name=Back

# =============================================================================
# 1. CONEXÃO COM O BANCO (Híbrida: MySQL Local vs Postgres Nuvem)
# =============================================================================

# Se existir SPRING_DATASOURCE_URL (Render), usa ela.
# Se não existir, usa o padrão local (jdbc:mysql://localhost:3306/stockbot).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/stockbot}

# Usuário: Pega do ambiente ou usa 'root'
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}

# Senha: Pega do ambiente ou usa 'aluno' (sua senha local)
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:aluno}

# =============================================================================
# 2. JPA / HIBERNATE
# =============================================================================

# Em DEV (Local), 'update' cria as tabelas sozinho.
# Em PROD, o ideal seria 'validate', mas 'update' funciona para começar.
spring.jpa.hibernate.ddl-auto=update

# Mostra o SQL no console (bom para debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- IMPORTANTE: REMOVA OU COMENTE A LINHA DO DIALETO ---
# Deixe o Spring Boot detectar sozinho se é MySQL ou Postgres.
# # spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =============================================================================
# 3. MIGRAÇÕES (FLYWAY) - DESATIVAR TEMPORARIAMENTE
# =============================================================================
# Como MySQL e Postgres têm SQLs diferentes, o Flyway pode dar erro.
# Vamos deixar o Hibernate (ddl-auto) criar as tabelas por enquanto.
spring.flyway.enabled=false

# =============================================================================
# 4. SEGURANÇA E OUTROS
# =============================================================================
api.security.token.secret=${JWT_SECRET:N2RVZTEzYjQtODIzZS00ZjNhLTg1MTAtZGRkZTA3YmY0N2Y4YzJkMzJhYjktZDE1Mi00YmZmLTk0NWEtN2UwY2QxZDY0ZQ===}
api.security.cors.origins=${CORS_ORIGINS:*}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:fake@test.com}
spring.mail.password=${MAIL_PASSWORD:fake}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

api.email.enabled=${EMAIL_ENABLED:false}

server.port=${PORT:8080}